<rect x="405" y="440" width="925" height="430" rx="5" fill="#f4f9fd" stroke="#50a9e3" stroke-width="2"/><text x="430" y="475" class="h">Virtual network 10.20.0.0/16</text><rect x="450" y="505" width="840" height="320" rx="4" fill="#fff" stroke="#8ac6ee" stroke-width="2" stroke-dasharray="7 5"/><text x="475" y="540" class="l">Session-host subnet 10.20.1.0/24</text><text x="1050" y="540" class="sm">NSG • no public IPs</text>
