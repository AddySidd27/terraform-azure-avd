<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
<title id="title">Azure Virtual Desktop with FSLogix architecture</title><desc id="desc">Architecture showing Terraform, Microsoft Entra ID, Azure Virtual Desktop, pooled session hosts, Entra Kerberos, Azure Files, and FSLogix profiles.</desc>
