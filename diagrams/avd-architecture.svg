<g transform="translate(65 790)"><text class="h">Connection flow</text><text y="40" class="sm">1  Authenticate with Entra ID</text><text y="70" class="sm">2  Discover assigned desktop</text><text y="100" class="sm">3  Broker pooled session</text><text y="130" class="sm">4  Request cloud Kerberos ticket</text><text y="160" class="sm">5  Mount profile over SMB 445</text><text y="190" class="sm">6  Attach persistent VHDX</text></g>
<text x="405" y="925" class="sm">Post-deployment validation: tenant consent • cloud group SID tag • share RBAC • profile-root ACLs • sign-out/sign-in persistence test</text><text x="1510" y="1010" class="sm">AVD lab architecture</text>
